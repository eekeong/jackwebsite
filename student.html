<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万能教Jack老师 | 学生中心</title>
  <link rel="icon" type="image/png" href="images/Jack_logo.png" />
  <link rel="shortcut icon" type="image/png" href="images/Jack_logo.png" />
  <link rel="apple-touch-icon" href="images/Jack_logo.png" />
  <link rel="stylesheet" href="css/style.css?v=1.0.6">
</head>

<body style="background-color: var(--dark); min-height: 100vh; color: var(--white);">

  <!-- Unified Top Navigation -->
  <nav class="navbar scrolled" id="navbar" role="navigation" aria-label="主导航">
    <div class="nav-container">
      <a href="./" class="nav-logo" id="navLogo" aria-label="万能教 Jack 老师 首页">
        <img src="images/Jack_logo.png" alt="万能教Jack老师" class="nav-logo-img" />
        <span class="nav-logo-main">万能教JACK老师</span>
      </a>

      <div class="nav-menu" role="menubar">
        <a href="./" class="nav-link" role="menuitem">首页</a>
        <a href="shop" class="nav-link" role="menuitem">课程</a>
        <a href="schedule" class="nav-link" role="menuitem">上课时间</a>
        <a href="./#faq" class="nav-link" role="menuitem">FAQ</a>
      </div>

      <div class="nav-actions">
        <button class="nav-icon-btn" id="navCartBtn" aria-label="购物车" title="购物车" onclick="openCart()">
          <div style="position:relative; display:inline-flex;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="22" height="22">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="cart-badge cart-count" id="navCartBadge" aria-label="购物车商品数量">0</span>
          </div>
        </button>

        <button class="btn-nav-login" id="navLoginBtn" onclick="openLogin()" aria-label="Login/Sign Up">Login/Sign Up</button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 100px; padding-bottom: 80px; min-height: 80vh;">

    <!-- 1. NOT LOGGED IN STATE: System Auth Form Card -->
    <div id="login-gate" style="display:none; max-width: 460px; margin: 20px auto 0 auto;">
      <div class="checkout-form-box" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--pink); border-radius: 20px; padding: 30px 25px; text-align: center; background: var(--dark-card);">
        
        <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(252, 12, 151, 0.1); border: 1.5px solid var(--pink); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; box-shadow: 0 0 20px rgba(252, 12, 151, 0.25);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>

        <!-- Tab Controls -->
        <div style="display:flex; border-bottom:2px solid rgba(255,255,255,0.1); margin-bottom:20px;">
          <button id="pg-tab-login" onclick="switchPageAuthTab('login')" style="flex:1; padding:10px; font-weight:800; font-size:15px; border:none; background:none; color:var(--pink); border-bottom:3px solid var(--pink); cursor:pointer;">
            🔑 登录账号
          </button>
          <button id="pg-tab-register" onclick="switchPageAuthTab('register')" style="flex:1; padding:10px; font-weight:800; font-size:15px; border:none; background:none; color:var(--grey-muted); border-bottom:3px solid transparent; cursor:pointer;">
            📝 注册新账号
          </button>
        </div>

        <!-- Login Form View -->
        <div id="pg-auth-login">
          <p style="color:var(--grey-muted); font-size:13px; margin-bottom: 20px;">
            请使用您的系统账号与密码登录以查阅报名记录：
          </p>
          <form onsubmit="handlePageLogin(event)" style="display:flex; flex-direction:column; gap:12px; text-align:left;">
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:4px;">电子邮箱 (Email) *</label>
              <input type="email" id="pg-login-email" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:10px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="例如 student@gmail.com" required>
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:4px;">密码 (Password) *</label>
              <input type="password" id="pg-login-password" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:10px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="padding:11px; font-size:14px; border-radius:8px; background:var(--pink); margin-top:4px;">
              🔑 确认登录
            </button>
          </form>
          <div style="margin-top:16px; font-size:12px; color:var(--grey-muted);">
            还没有账号？<a href="javascript:void(0)" onclick="switchPageAuthTab('register')" style="color:var(--pink); font-weight:800; text-decoration:underline;">免费注册系统账号 →</a>
          </div>
        </div>

        <!-- Register Form View -->
        <div id="pg-auth-register" style="display:none;">
          <p style="color:var(--grey-muted); font-size:13px; margin-bottom: 16px;">
            请填写以下个人资料建立您的学员账户：
          </p>
          <form onsubmit="handlePageRegister(event)" style="display:flex; flex-direction:column; gap:10px; text-align:left;">
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:2px;">学员姓名 (Full Name) *</label>
              <input type="text" id="pg-reg-name" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:9px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="例如 张小明 / Lim Wei Han" required>
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:2px;">WhatsApp 电话号码 *</label>
              <input type="tel" id="pg-reg-whatsapp" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:9px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="例如 0123456789" required>
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:2px;">电子邮箱 (Email) *</label>
              <input type="email" id="pg-reg-email" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:9px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="例如 student@gmail.com" required>
            </div>
            <div>
              <label style="font-size:12px; font-weight:700; color:var(--white); display:block; margin-bottom:2px;">设置密码 (Password) *</label>
              <input type="password" id="pg-reg-password" class="form-control" style="background:#150e1f; color:#fff; border:1px solid rgba(255,255,255,0.15); padding:9px 12px; border-radius:8px; width:100%; font-size:13px;" placeholder="设置登录密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="padding:11px; font-size:14px; border-radius:8px; background:var(--pink); margin-top:4px;">
              ✨ 立即注册并登录
            </button>
          </form>
          <div style="margin-top:14px; font-size:12px; color:var(--grey-muted);">
            已有系统账号？<a href="javascript:void(0)" onclick="switchPageAuthTab('login')" style="color:var(--pink); font-weight:800; text-decoration:underline;">直接登录 →</a>
          </div>
        </div>

      </div>
    </div>

    <!-- 2. LOGGED IN STATE: Order History Dashboard -->
    <div id="student-panel" style="display:none; max-width: 900px; margin: 0 auto;">
      
      <!-- Student Profile Header Banner -->
      <div style="background: var(--dark-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 25px 30px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; box-shadow: var(--shadow-md);">
        <div style="display: flex; align-items: center; gap: 16px;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; font-weight: 800; box-shadow: 0 4px 15px rgba(252, 12, 151, 0.3);" id="user-avatar">
            👤
          </div>
          <div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <h1 style="font-family: var(--font-title); font-size: 22px; color: var(--white); margin: 0;" id="user-display-name">学员姓名</h1>
              <span class="badge" style="background: rgba(252, 12, 151, 0.15); color: var(--pink); border: 1px solid var(--pink); font-size: 11px; padding: 2px 8px;" id="user-provider-badge">Social Login</span>
            </div>
            <p style="font-size: 13px; color: var(--grey-muted); margin-top: 4px;" id="user-email-display">student@email.com</p>
          </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="shop" class="btn btn-outline-pink btn-sm" style="border-radius: var(--radius-sm);">继续选课</a>
          <button onclick="handleStudentLogout()" class="btn btn-outline btn-sm" style="border-radius: var(--radius-sm); border-color: rgba(255,255,255,0.2); color: var(--grey-muted);">退出账号</button>
        </div>
      </div>

      <!-- Section Title -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-family: var(--font-title); font-size: 20px; color: var(--white); display: flex; align-items: center; gap: 8px;">
          🛒 您的课程报名订单历史 (Order History)
        </h2>
        <span style="font-size: 13px; color: var(--grey-muted);" id="order-count-text">共 0 笔订单</span>
      </div>

      <!-- Orders Container List -->
      <div id="student-orders-container">
        <!-- 动态渲染订单历史卡片 -->
      </div>

    </div>

  </div>

  <script src="js/app.js?v=1.0.6"></script>
  <script src="js/main.js?v=1.0.6"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkStudentSession();
      Cart.updateUI();
    });

    function switchPageAuthTab(tab) {
      const loginView = document.getElementById("pg-auth-login");
      const regView = document.getElementById("pg-auth-register");
      const btnLogin = document.getElementById("pg-tab-login");
      const btnReg = document.getElementById("pg-tab-register");
      if (!loginView || !regView || !btnLogin || !btnReg) return;

      if (tab === 'register') {
        loginView.style.display = "none";
        regView.style.display = "block";
        btnReg.style.color = "var(--pink)";
        btnReg.style.borderBottom = "3px solid var(--pink)";
        btnLogin.style.color = "var(--grey-muted)";
        btnLogin.style.borderBottom = "3px solid transparent";
      } else {
        loginView.style.display = "block";
        regView.style.display = "none";
        btnLogin.style.color = "var(--pink)";
        btnLogin.style.borderBottom = "3px solid var(--pink)";
        btnReg.style.color = "var(--grey-muted)";
        btnReg.style.borderBottom = "3px solid transparent";
      }
    }

    function handlePageRegister(e) {
      e.preventDefault();
      const name = document.getElementById("pg-reg-name").value.trim();
      const whatsapp = document.getElementById("pg-reg-whatsapp").value.trim();
      const email = document.getElementById("pg-reg-email").value.trim().toLowerCase();
      const password = document.getElementById("pg-reg-password").value;

      if (!name || !whatsapp || !email || !password) {
        alert("请填写所有必需的注册信息！");
        return;
      }

      const userObj = {
        studentName: name,
        whatsapp: whatsapp,
        email: email,
        password: password,
        provider: '系统账号注册',
        grade: 'Form 5',
        loginTime: new Date().toLocaleString()
      };

      window.StudentAuth.registerUser(userObj);
      checkStudentSession();
    }

    function handlePageLogin(e) {
      e.preventDefault();
      const email = document.getElementById("pg-login-email").value.trim().toLowerCase();
      const password = document.getElementById("pg-login-password").value;

      if (email === "admin@eduhero.com.my") {
        if (password === "eduhero") {
          sessionStorage.setItem("jack_admin_logged_in", "true");
          localStorage.setItem("jack_admin_logged_in", "true");
          window.location.href = "admin";
        } else {
          alert("Invalid admin password!");
        }
        return;
      }

      const regUsers = window.StudentAuth ? window.StudentAuth.getRegisteredUsers() : [];
      const foundUser = regUsers.find(u => u.email && u.email.toLowerCase() === email);

      let studentName = email.split('@')[0] || "学员";
      let whatsapp = "";

      if (foundUser) {
        studentName = foundUser.studentName || studentName;
        whatsapp = foundUser.whatsapp || "";
      } else {
        try {
          const orders = window.OrderDB ? window.OrderDB.getAll() : [];
          const foundOrder = orders.find(o => o.email && o.email.toLowerCase() === email);
          if (foundOrder && foundOrder.studentName) {
            studentName = foundOrder.studentName;
            whatsapp = foundOrder.phone || "";
          }
        } catch(err) {}
      }

      const userObj = {
        studentName: studentName,
        whatsapp: whatsapp,
        email: email,
        provider: '系统账号',
        grade: 'Form 5',
        loginTime: new Date().toLocaleString()
      };

      window.StudentAuth.set(userObj);
      checkStudentSession();
    }

    function checkStudentSession() {
      const student = window.StudentAuth ? window.StudentAuth.get() : null;

      const loginGate = document.getElementById("login-gate");
      const studentPanel = document.getElementById("student-panel");

      if (student && (student.studentName || student.name || student.email)) {
        loginGate.style.display = "none";
        studentPanel.style.display = "block";

        const name = student.studentName || student.name || "学员";
        const email = student.email || "系统账号注册";
        const provider = student.provider || "系统账号";

        document.getElementById("user-display-name").textContent = name;
        document.getElementById("user-email-display").textContent = email;
        document.getElementById("user-provider-badge").textContent = provider;
        document.getElementById("user-avatar").textContent = name.slice(0, 1).toUpperCase() || "👤";

        renderOrderHistory(email, name);
      } else {
        loginGate.style.display = "block";
        studentPanel.style.display = "none";
      }
    }

    function renderOrderHistory(email, name) {
      const container = document.getElementById("student-orders-container");
      const countEl = document.getElementById("order-count-text");
      if (!container) return;

      const allOrders = OrderDB.getAll() || [];
      
      // 比对属于该学生的订单（按 email 或 studentName 匹配，若无精准匹配则展示该用户建立的订单或公共演示订单）
      const userOrders = allOrders.filter(o => {
        if (!o) return false;
        if (email && o.email && o.email.toLowerCase() === email.toLowerCase()) return true;
        if (name && o.studentName && o.studentName.toLowerCase() === name.toLowerCase()) return true;
        return false;
      });

      // 如果是测试 demo 用户，若没有找到精确的则兜底匹配所有符合展示条件的订单
      const displayOrders = userOrders.length > 0 ? userOrders : allOrders;

      countEl.textContent = `共 ${displayOrders.length} 笔订单`;
      container.innerHTML = "";

      if (displayOrders.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 60px 20px; background: var(--dark-card); border-radius: var(--radius-lg); border: 1px dashed rgba(255,255,255,0.15);">
            <span style="font-size: 56px;">🛒</span>
            <h3 style="font-family: var(--font-title); font-size: 18px; color: var(--white); margin-top: 15px;">暂无历史课程报名记录</h3>
            <p style="color: var(--grey-muted); font-size: 13px; margin: 10px 0 25px 0;">赶快前往选课商城为自己挑选几门最强的 SPM 冲刺课程吧！</p>
            <a href="shop" class="btn btn-primary" style="padding: 12px 28px;">👉 立即前往选课商城</a>
          </div>
        `;
        return;
      }

      displayOrders.forEach(order => {
        const card = document.createElement("div");
        card.className = "order-history-card";

        const orderId = order.id || "JK-ORDER";
        const dateStr = order.date || "最新购买";
        const totalStr = typeof order.total === 'number' ? order.total.toFixed(2) : parseFloat(order.total || 0).toFixed(2);
        const methodStr = order.method || "Online Payment";
        const coursesStr = (order.courses && order.courses.length > 0) ? order.courses.join(", ") : "SPM Sejarah 精品特惠班";
        const statusText = order.status === 'Paid' ? '✅ 付款成功 (Paid)' : '⏳ 人工审核中';

        // 客服联系链接
        const waGroupUrl = "https://wa.link/fnttf0";

        card.innerHTML = `
          <div class="order-card-header">
            <div class="order-card-id">
              <span>📄 订单号：</span>
              <strong style="color: var(--pink); font-family: var(--font-title);">${orderId}</strong>
            </div>
            <span class="order-card-status">${statusText}</span>
          </div>

          <div class="order-card-body">
            <div class="order-card-course">${coursesStr}</div>
            <div class="order-card-meta">
              <span>📅 下单时间：${dateStr}</span>
              <span>👤 报名人：${order.studentName || name} (${order.grade || 'Form 5'})</span>
            </div>
          </div>

          <div class="order-card-footer">
            <div>
              <span style="font-size: 12px; color: var(--grey-muted);">实付总额 (${methodStr})：</span>
              <span class="order-card-price">RM ${totalStr}</span>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <a href="${waGroupUrl}" target="_blank" class="btn btn-primary btn-sm" style="font-size: 12px; padding: 8px 16px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px;">
                <span>💬 点击联系客服</span>
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>

</html>
