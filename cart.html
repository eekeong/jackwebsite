  <!-- =============================================

      <!-- Logo -->
      <a href="./" class="nav-logo" id="navLogo" aria-label="万能教 Jack 老师 首页">
        <img src="images/Jack_logo.png" alt="万能教Jack老师" class="nav-logo-img" />
        <span class="nav-logo-main">万能教JACK老师</span>
      </a>

      <!-- Desktop Nav Links -->
      <div class="nav-menu" role="menubar">
        <a href="index.html" class="nav-link" role="menuitem">首页</a>
        <a href="shop.html" class="nav-link" role="menuitem">课程</a>
        <a href="schedule.html" class="nav-link" role="menuitem">上课时间</a>

      <!-- Action Icons -->
      <div class="nav-actions">
        <!-- Cart -->
        <button class="nav-icon-btn" id="navCartBtn" aria-label="购物车" title="购物车" onclick="openCart()">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="22" height="22">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />

            <span class="cart-badge cart-count" id="navCartBadge" aria-label="购物车商品数量">0</span>

        <!-- Student Login - Filled Pink Button -->
        <button class="btn-nav-login" id="navLoginBtn" onclick="openLogin()" aria-label="Login/Sign Up">Login/Sign Up</button>
      </div>

      <!-- Hamburger (Mobile) -->
      <button class="hamburger" id="hamburger" aria-label="打开菜单" aria-expanded="false">

  <!-- Mobile Dropdown Menu (Unified) -->
  <div class="mobile-menu" id="mobileMenu" role="menu" aria-hidden="true">
    <a href="index.html" role="menuitem" onclick="closeMobileMenu()">首页</a>
    <a href="shop.html" role="menuitem" onclick="closeMobileMenu()">课程</a>
    <a href="schedule.html" role="menuitem" onclick="closeMobileMenu()">上课时间</a>
    <a href="index.html#faq" role="menuitem" onclick="closeMobileMenu()">FAQ</a>
    <a href="shop.html" role="menuitem" onclick="closeMobileMenu()"
      style="color: var(--pink); margin-top: 8px; display: block; font-size: 0.95rem;">立即选课 →</a>
  </div>

  <div class="container" style="padding-top: 40px; min-height: 70vh;">
    <h1
      style="font-family: var(--font-title); font-size: 24px; color: var(--dark); margin-bottom: 20px; border-bottom: 2px solid var(--pink-pale); padding-bottom: 10px;">
      🛒 您的购物车
    </h1>

    <!-- Empty Cart Fallback -->
    <div id="cart-empty-view" style="display:none; text-align:center; padding: 60px 20px;" class="checkout-form-box">
      <span style="font-size: 64px;">🛒</span>
      <h2 style="font-family: var(--font-title); font-size: 20px; color: var(--text-main); margin-top: 20px;">您的购物车空空如也！
      </h2>
      <p style="color: var(--grey-muted); font-size:14px; margin: 10px 0 25px 0;">赶快去我们的课程商城为自己挑选几门最强 Sejarah 冲刺课程吧！</p>
      <a href="shop.html" class="btn btn-primary" style="padding: 12px 30px;">👉 立即前往课程商城选课</a>
    </div>

    <!-- Active Cart Layout -->
    <div id="cart-active-view" class="cart-layout">
      <!-- Left Column: Items List -->
      <div id="cart-items-list" class="cart-items">
        <!-- 动态注入加购的课程 -->
      </div>

      <!-- Right Column: Summary Card -->
      <aside class="cart-summary">
        <h2
          style="font-family: var(--font-title); font-size: 18px; color: var(--text-main); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
          费用明细</h2>

        <div class="summary-row">
          <span>商品小计 (Subtotal)</span>
          <span id="summary-subtotal">RM 0.00</span>
        </div>

        <!-- Promo Coupon Display Area -->
        <div id="summary-promo-row" class="summary-row" style="display:none; color: var(--pink); font-weight: 700;">
          <span id="summary-promo-label">优惠券折扣</span>
          <span id="summary-promo-value">-RM 0.00</span>
        </div>

        <!-- Coupon Form -->
        <div class="promo-form">
          <input type="text" id="promo-code-input" class="promo-input" placeholder="输入折扣券 (例如 JACKEARLY)">
          <button id="btn-apply-promo" class="btn btn-secondary btn-sm"
            style="border-radius: var(--radius-sm);">应用</button>
        </div>
        <div id="promo-status-msg" style="font-size: 11px; margin-top:-15px; margin-bottom:15px; display:none;"></div>

        <div class="summary-row total">
          <span>应付总额 (Total)</span>
          <span id="summary-total">RM 0.00</span>
        </div>

        <div
          style="background-color: var(--warning-light); color: var(--warning); border: 1px solid rgba(249, 115, 22, 0.2); padding: 12px; border-radius: var(--radius-md); font-size: 11px; line-height: 1.5; margin-bottom: 20px;">
          ⚠️ <b>付款提醒</b>：请在点击结算前，确认每门课程的上课日期和 Form 年级。付款成功后将立即发送 WhatsApp 激活说明。
        </div>

        <button onclick="handleProceedToCheckout()" class="btn btn-primary btn-full" style="font-size: 16px; border:none; cursor:pointer;">💳 继续结账手续 ➔</button>
        <a href="shop.html" class="btn btn-outline-purple btn-full btn-sm" style="margin-top: 10px;">继续选课</a>
      </aside>
    </div>
  </div>

  <script src="js/app.js?v=1.6.0"></script>
  <script src="js/main.js?v=1.3.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const emptyView = document.getElementById("cart-empty-view");
      const activeView = document.getElementById("cart-active-view");
      const itemsContainer = document.getElementById("cart-items-list");

      const subtotalText = document.getElementById("summary-subtotal");
      const promoRow = document.getElementById("summary-promo-row");
      const promoLabel = document.getElementById("summary-promo-label");
      const promoValue = document.getElementById("summary-promo-value");
      const totalText = document.getElementById("summary-total");

      const promoInput = document.getElementById("promo-code-input");
      const applyPromoBtn = document.getElementById("btn-apply-promo");
      const promoStatusMsg = document.getElementById("promo-status-msg");

      function renderCart() {
        const items = Cart.getDetails();

        if (items.length === 0) {
          emptyView.style.display = "block";
          activeView.style.display = "none";
          return;
        } else {
          emptyView.style.display = "none";
          activeView.style.display = "grid";
        }

        // 渲染加购课程项列表
        itemsContainer.innerHTML = "";
        items.forEach(item => {
          if (!item) return;
          const card = document.createElement("div");
          card.className = "cart-item";

          // Display custom selections if available
          const planName = item.priceOption || "";
          const formVal = item.formOption || item.targetAudience || item.form || "Form 1-5 适用";
          const timeVal = item.timeOption || (item.timeOptions ? item.timeOptions[0] : null) || item.time || "随买随看";
          const titleVal = item.title || "专属课程/教材";
          const priceVal = typeof item.price === "number" ? item.price : parseFloat(item.price || 0);
          let coverImg = item.coverImage || item.imgBack || (item.galleryMedia && item.galleryMedia[0] ? item.galleryMedia[0].src : null) || "images/product-course.png";
          if (item.id === 'sej-regular' || (typeof item.id === 'string' && item.id.startsWith('sej-regular'))) {
            coverImg = "images/Card_Photo/IMG_7567 (1).png";
          }

          card.innerHTML = `
            <div style="width: 80px; height: 80px; background: #f9f9f9; border-radius: var(--radius-sm); border: 1px solid var(--border-color); display:flex; justify-content:center; align-items:center; overflow:hidden; flex-shrink:0;">
              <img src="${coverImg}" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="cart-item-info">
              <h3 class="cart-item-title">${titleVal}</h3>
              ${planName ? `<p style="font-size: 13px; color: var(--pink); font-weight: 800; margin-top:2px; margin-bottom:2px;">[${planName}]</p>` : ''}
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top: 4px;">
                <span class="badge badge-form" style="font-size:10px; padding:2px 6px;">${formVal}</span>
                <span class="badge" style="font-size:10px; padding:2px 6px; background:#f0f0f0; color:#555;">${timeVal}</span>
              </div>
            </div>
            <div class="cart-item-price" style="font-weight: 900;">RM ${priceVal.toFixed(2)}</div>
            <button onclick="handleRemoveItem('${item.cartItemId || item.id}')" class="btn-remove" title="从购物车移出">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          `;
          itemsContainer.appendChild(card);
        });

        // 渲染账单明细数据
        const subtotal = Cart.getSubtotal();
        const promo = Cart.getPromo();
        const total = Cart.getTotal();

        subtotalText.textContent = `RM ${subtotal.toFixed(2)}`;

        if (promo) {
          promoRow.style.display = "flex";
          promoLabel.textContent = `优惠券 (${promo.code})`;

          if (promo.type === "flat") {
            promoValue.textContent = `-RM ${promo.value.toFixed(2)}`;
          } else {
            const discountAmount = subtotal * (promo.value / 100);
            promoValue.textContent = `-RM ${discountAmount.toFixed(2)} (${promo.value}%)`;
          }

          promoStatusMsg.style.display = "block";
          promoStatusMsg.style.color = "var(--success)";
          promoStatusMsg.innerHTML = `已应用：${promo.label} <button onclick="handleRemovePromo()" style="background:none; border:none; color:var(--pink); font-size:10px; font-weight:700; margin-left:8px; cursor:pointer; text-decoration:underline;">移除</button>`;
        } else {
          promoRow.style.display = "none";
          promoStatusMsg.style.display = "none";
        }

        totalText.textContent = `RM ${total.toFixed(2)}`;

        // 同步顶部微标数量
        Cart.updateUI();
      }

      // 处理移除单项商品
      window.handleRemoveItem = function (id) {
        Cart.remove(id);
        renderCart();
      };

      // 绑定优惠券应用
      applyPromoBtn.addEventListener("click", () => {
        const code = promoInput.value;
        if (!code) return;
        const res = Cart.applyPromo(code);

        promoStatusMsg.style.display = "block";
        if (res.success) {
          promoInput.value = "";
          renderCart();
        } else {
          promoStatusMsg.style.color = "var(--pink)";
          promoStatusMsg.textContent = res.message;
        }
      });

      // 点击【继续结账】跳转 WhatsApp 链接
      window.handleProceedToCheckout = function () {
        const currentUser = window.StudentAuth ? window.StudentAuth.get() : null;
        if (!currentUser) {
          if (typeof window.openStudentRegisterModal === 'function') {
            window.openStudentRegisterModal('https://wa.link/yusvrp');
          } else {
            sessionStorage.setItem("jack_post_login_redirect", "https://wa.link/yusvrp");
            if (typeof openLogin === 'function') {
              openLogin();
            } else {
              window.location.href = "index.html?openAuth=register";
            }
          }
          return;
        }
        window.location.href = "https://wa.link/yusvrp";
      };

      // 处理移除优惠券
      window.handleRemovePromo = function () {
        Cart.removePromo();
        renderCart();
      };

      // 初始化渲染
      renderCart();
    });
  </script>
</body>

</html>
