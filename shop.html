  <style>
    /* =============================================
       SHOP PAGE — SERVICES CARD DESIGN
       ============================================= */
    :root {
      --shop-bg: #f8f7f4;
      --card-bg: #f0eeeb;
      --card-hover-bg: #e8e5e0;
      --card-radius: 28px;
      --pink: #FC0C97;
    }

    body {
      background: var(--shop-bg);
    }

    /* Reset bottom padding since we removed bottom nav */
    @media (max-width: 768px) {
      body {
        padding-bottom: 0 !important;
      }
    }

    /* ---- Page Section ---- */
    .shop-hero-section {
      padding: 140px 0 20px 0;
      text-align: center;
    }

    .shop-eyebrow {
      display: inline-block;
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
      background: rgba(252, 12, 151, 0.08);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .shop-main-title {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      color: #111;
      line-height: 1.15;
      margin: 0 0 16px 0;
      letter-spacing: -0.03em;
    }

    .shop-main-subtitle {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 400;
      color: #888;
      margin: 0 auto;
      max-width: 500px;
      line-height: 1.6;
    }

    /* ---- Services Grid ---- */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 60px auto 0 auto;
      padding: 0 20px;
    }

    @media (max-width: 600px) {
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 30px;
        padding: 0 12px;
      }
    }

    /* ---- Card ---- */
    .service-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 28px 28px 24px 28px;
      display: flex;
      flex-direction: column;
      height: 320px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .service-card:hover {
      background: var(--card-hover-bg);
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    @media (max-width: 600px) {
      .service-card {
        height: 220px;
        padding: 14px 14px 14px 14px;
        border-radius: 18px;
      }
    }
    
    .service-card {
      animation: shopCardFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* ---- Image Area ---- */
    .service-card-images {
      flex-grow: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .service-img-back,
    .service-img-front {
      position: absolute;
      width: 180px;
      max-height: 200px;
      height: auto;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      object-fit: contain;
    }

    .service-img-back {
      transform: rotate(-6deg);
    }

    .service-img-front {
      transform: rotate(3deg);
    }

    .service-card:hover .service-img-back {
      transform: rotate(-10deg) scale(1.05);
    }

    .service-card:hover .service-img-front {
      transform: rotate(5deg) scale(1.05);
    }

    @media (max-width: 600px) {
      .service-img-back,
      .service-img-front {
        width: 105px;
      }
    }

    /* ---- Card Footer ---- */
    .service-card-footer {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .service-card-text {
      flex: 1;
    }

    .service-card-title {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.3;
      margin: 0 0 2px 0;
    }

    @media (max-width: 600px) {
      .service-card-title {
        font-size: 11px;
      }
      .service-card-sub {
        font-size: 10px;
      }
      .service-card-arrow {
        width: 28px;
        height: 28px;
      }
    }

    .service-card-sub {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #999;
      margin: 0;
    }

    .service-card-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .service-card:hover .service-card-arrow {
      background: var(--pink);
      transform: rotate(-45deg);
    }

    .service-card:hover .service-card-arrow svg {
      stroke: #fff;
    }

    /* ---- CTA strip at bottom ---- */

      text-align: center;
      padding: 60px 20px 80px 20px;
      max-width: 600px;
      margin: 0 auto;

    .shop-cta-btn {

      align-items: center;
      gap: 10px;
      background: var(--pink);
      color: #fff;

      font-weight: 800;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(252, 12, 151, 0.3);
    }

    .shop-cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(252, 12, 151, 0.4);
    }

    @keyframes shopCardFadeUp {
      0% { opacity: 0; transform: translate3d(0, 40px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

  <script>
    // ── Default cards (shown if Admin has never saved custom data) ──
    const DEFAULT_SHOP_CARDS = [
      {
        id: 'sej-regular',
        title: 'Sejarah 正课班',
        subtitle: 'Form 1–5',
        imgBack: 'images/Card_Photo/IMG_7567 (1).png',
        imgFront: 'images/Card_Photo/card4-students-A.png',
        link: 'course-detail.html?id=sej-regular'
      },
      {
        id: 'sej-obj-200',
        title: '「会说话」Sejarah OBJ 200题宝典',
        subtitle: 'Form 5',
        imgBack: 'images/product-book.png',
        imgFront: 'images/Card_Photo/2.png',
        link: 'course-detail.html?id=sej-obj-200'
      },
      {
        id: 'sej-trial-f5',
        title: 'Sejarah SPM 攻攻班',
        subtitle: 'Form 5',
        imgBack: 'images/product-course.png',
        imgFront: 'images/Card_Photo/60.png',
        link: 'course-detail.html?id=sej-trial-f5'
      },
      {
        id: 'sej-bundle',
        title: 'Sejarah 万能宝典',
        subtitle: 'Form 4–5',
        imgBack: 'images/product-bundle.png',
        imgFront: 'images/Jack Ler2 (1).png',
        link: 'course-detail.html?id=sej-bundle'
      }
    ];

    function renderShopCards() {
      const grid = document.getElementById('shopCardsGrid');
      if (!grid) return;

      const saved = localStorage.getItem('jackShopCards');
      const cards = saved ? JSON.parse(saved) : DEFAULT_SHOP_CARDS;

      // If nothing in localStorage yet, seed defaults so admin sees them too
      if (!saved) localStorage.setItem('jackShopCards', JSON.stringify(DEFAULT_SHOP_CARDS));

      grid.innerHTML = '';
      cards.forEach((card, index) => {
        const ARROW_SVG = `<svg width="16" height="16" fill="none" stroke="#333" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>`;
        let cardLink = card.link || `course-detail.html?id=${card.id}`;
        if (cardLink === 'course-detail.html' || cardLink === 'course-details.html') {
          cardLink = `course-detail.html?id=${card.id}`;
        }
        
        const el = document.createElement('a');
        el.href = cardLink;
        el.className = 'service-card';
        el.style.animationDelay = (index * 0.12) + 's';
        el.innerHTML = `
          <div class="service-card-images">
            <img class="service-img-back" src="${card.imgBack}" alt="${card.title}"
              onerror="this.style.background='linear-gradient(135deg,#FC0C97,#8b5cf6)';this.onerror=null;this.src='';" />
            <img class="service-img-front" src="${card.imgFront}" alt="${card.title}"
              onerror="this.style.background='linear-gradient(135deg,#8b5cf6,#FC0C97)';this.onerror=null;this.src='';" />
          </div>
          <div class="service-card-footer">
            <div class="service-card-text">
              <h3 class="service-card-title">${card.title}</h3>
              <p class="service-card-sub">${card.subtitle}</p>
            </div>
            <div class="service-card-arrow">${ARROW_SVG}</div>
          </div>`;
        grid.appendChild(el);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderShopCards();
      Cart.updateUI();
    });
  </script>
